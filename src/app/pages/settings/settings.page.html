<app-page>
  <header class="page-head">
    <div class="container">
      <span class="eyebrow">Preferences</span>
      <h1>Settings</h1>
    </div>
  </header>

  <section class="container section narrow">
    @if (!auth.isLoggedIn()) {
      <div class="card card--pad login-card">
        <div>
          <strong>You are browsing as a guest</strong>
          <p class="muted">Log in to save your details and follow your orders.</p>
        </div>
        <a class="btn btn--primary btn--sm" routerLink="/login">Log in</a>
      </div>
    }

    <ul class="list card">
      @for (link of visible(); track link.url) {
        <li>
          <a [routerLink]="link.url">
            <span class="icon"><ion-icon [name]="link.icon" /></span>
            <span class="text"><strong>{{ link.label }}</strong><small>{{ link.hint }}</small></span>
            <ion-icon name="chevron-forward-outline" class="chevron" />
          </a>
        </li>
      }
      @if (auth.isLoggedIn()) {
        <li>
          <button type="button" (click)="logout()">
            <span class="icon"><ion-icon name="log-out-outline" /></span>
            <span class="text"><strong>Log out</strong><small>See you again soon</small></span>
          </button>
        </li>
      }
    </ul>
  </section>
</app-page>
