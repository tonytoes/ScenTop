<ion-content [scrollY]="false">
  <main class="splash">
    <div class="orb orb--one"></div>
    <div class="orb orb--two"></div>

    <div class="center">
      <img class="logo" src="assets/images/logo-hat.png" alt="ScenTop logo" width="220" height="189" />
      <h1>ScenTop</h1>
      <p class="tagline">Where scent can protect you</p>
    </div>

    <div class="bottom">
      <p>Find your signature scent</p>
      <button type="button" class="btn btn--primary btn--block" (click)="start()">Get started</button>
      <div class="progress" aria-hidden="true"><span></span></div>
    </div>
  </main>
</ion-content>
