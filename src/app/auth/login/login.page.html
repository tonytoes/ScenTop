<ion-content
  class="[--background:var(--color-island-spice-50)] [--color:var(--color-masala-700)]"
  [fullscreen]="true"
>
  <main
    class="mx-auto flex min-h-full w-full max-w-107.5 flex-col px-6 pt-[max(130px,24vh)] pb-8 font-sans min-[361px]:px-9"
  >
    <div
      class="flex items-center justify-center gap-2 text-2xl font-medium tracking-[-0.4px]"
      aria-label="ScenTop"
    >
      <img
        src="assets/images/logo.png"
        alt="ScenTop Logo"
        class="h-auto w--auto"
      />

      <span>ScenTop</span>
    </div>

    <span class="m-0 text-center text-2xl font-medium">Welcome Back!</span>

    <p class="mt-1.75 mb-5.5 text-center text-[13px] text-storm-dust-600">
      Please login to your account
    </p>

    <form class="grid gap-3.25" [formGroup]="form" (ngSubmit)="submit()">
      <ion-item
        class="min-h-12.5 rounded-[11px] border border-wewak-100 shadow-md shadow-masala-950/15 [--background:var(--color-masala-50)] [--border-radius:11px] [--highlight-color-focused:var(--color-wewak-300)] [--inner-padding-end:17px] [--min-height:50px] [--padding-start:17px]"
        lines="none"
      >
        <ion-input
          class="text-sm [--color:var(--color-masala-700)] [--placeholder-color:var(--color-masala-400)] [--placeholder-opacity:1]"
          type="email"
          formControlName="email"
          placeholder="E-mail Address"
          autocomplete="email"
        ></ion-input>
      </ion-item>

      <ion-item
        class="min-h-12.5 rounded-[11px] border border-wewak-100 shadow-md shadow-masala-950/15 [--background:var(--color-masala-50)] [--border-radius:11px] [--highlight-color-focused:var(--color-wewak-300)] [--inner-padding-end:17px] [--min-height:50px] [--padding-start:17px]"
        lines="none"
      >
        <ion-input
          class="text-sm [--color:var(--color-masala-700)] [--placeholder-color:var(--color-masala-400)] [--placeholder-opacity:1]"
          type="password"
          formControlName="password"
          placeholder="Password"
          autocomplete="current-password"
        ></ion-input>
      </ion-item>

      @if (errorMessage) {
      <p
        class="mx-0.75 -mt-0.5 text-center text-xs leading-[1.35] text-wewak-700"
        role="alert"
      >
        {{ errorMessage }}
      </p>
      }

      <ion-button
        class="m-0 mt-0.5 min-h-12 text-sm normal-case [--background:var(--color-wewak-300)] [--background-hover:var(--color-wewak-400)] [--background-activated:var(--color-wewak-500)] [--border-radius:10px] [--box-shadow:0_4px_9px_color-mix(in_srgb,var(--color-wewak-500)_30%,transparent)] [--color:var(--color-masala-50)] disabled:opacity-65"
        type="submit"
        expand="block"
        [disabled]="loading"
      >
        @if (loading) {
        <ion-spinner name="crescent"></ion-spinner>
        } @else { Login Account }
      </ion-button>
    </form>

    <div class="mx-2 mt-5.5 mb-3.5 h-px bg-storm-dust-500"></div>

    <p class="mb-4.25 text-center text-xs text-storm-dust-600">
      Don't have an account?

      <a class="font-medium text-masala-700 no-underline" routerLink="/signup">
        Sign up here
      </a>
    </p>

    <ion-button
      class="relative m-0 min-h-12 text-sm normal-case [--background:var(--color-masala-50)] [--border-radius:10px] [--box-shadow:0_4px_10px_color-mix(in_srgb,var(--color-masala-950)_15%,transparent)] [--color:var(--color-masala-600)]"
      type="button"
      expand="block"
      (click)="googleSignIn()"
    >
      <img
        src="assets/icon/google.png"
        alt="Google Logo"
        class="absolute left-4 top-1/2 h-auto w-auto -translate-y-1/2"
      />

      Login with Google
    </ion-button>
  </main>
</ion-content>
