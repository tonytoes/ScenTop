<ion-content class="[--background:#fffaf0]" [fullscreen]="true">
  <div class="absolute top-1/2 right-0 left-0 -translate-y-1/2 text-center">
    <img
      src="assets/images/logo.png"
      alt="ScenTop Logo"
      class="h-auto w--auto"
    />
    <strong class="text-xl leading-6.5">
      Welcome, {{ user?.firstName }}!
    </strong>
    <ion-button
      class="mt-5 normal-case [--background:#ff98b0] [--border-radius:10px]"
      (click)="logout()"
    >
      Log out
    </ion-button>
  </div>
</ion-content>
