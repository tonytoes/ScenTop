name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:all

      - name: Type-check the server
        run: npm run typecheck:server

      - name: Server tests (run against an in-memory Postgres)
        run: npm run test:server

      - name: Angular tests
        run: npx ng test --watch=false

      - name: Build the website and the server
        run: npm run build:all
