# Render "Blueprint": one click deploys the website + API from this repo.
# https://render.com/docs/blueprint-spec
#
# Before the first deploy, have the Neon connection string ready (see "Deploy" in README.md).
# Render asks for every value marked "sync: false" (secrets are never stored in git).

services:
  - type: web
    name: scentop
    runtime: node
    plan: free
    region: singapore
    # Dev packages (Angular, TypeScript) are needed to build, so install them explicitly
    buildCommand: npm ci --include=dev && npm run build:all
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Neon connection string of the "scentop" database (Neon > Connect, pooled connection)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # Email-code and Google login (Neon > Auth). The Auth URL is public, it is also in the website.
      - key: NEON_AUTH_BASE_URL
        value: https://ep-curly-moon-b46gdsbd.neonauth.c-6.us-east-2.aws.neon.tech/neondb/auth
      # The live address of this site, e.g. https://scentop.onrender.com (no slash at the end).
      # Render shows it after the first deploy; then enter it here and redeploy.
      - key: AUTH_APP_ORIGIN
        sync: false
      # Admin studio login, created on the first start
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
