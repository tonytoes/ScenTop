# Render "Blueprint": one click deploys the website + API from this repo.
# https://render.com/docs/blueprint-spec
#
# Before the first deploy, create a Neon database and have its connection string ready.
# Render asks for DATABASE_URL because it is marked "sync: false" (a secret, never stored in git).

services:
  - type: web
    name: scentop
    runtime: node
    plan: free
    region: singapore
    # Dev packages (Angular, TypeScript) are needed to build, so install them explicitly
    buildCommand: npm ci --include=dev && npm run build:all
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
